name: What-if repro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Expected: fails, because ARM rejects the what-if (AccountNameInvalid).
  # Actual: passes and reports "Resource changes: no change."
  what-if-v2-4-0:
    name: What-if with azure/bicep-deploy v2.4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/bicep-deploy@v2.4.0
        with:
          type: deployment
          operation: whatIf
          name: whatif-repro-v2-4-0
          scope: resourceGroup
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          template-file: ./main.bicep
          parameters-file: ./main.bicepparam
          bicep-version: 0.48.1

  # Fails and shows the ARM error.
  what-if-v2-5-0:
    name: What-if with azure/bicep-deploy v2.5.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/bicep-deploy@v2.5.0
        with:
          type: deployment
          operation: whatIf
          name: whatif-repro-v2-5-0
          scope: resourceGroup
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          template-file: ./main.bicep
          parameters-file: ./main.bicepparam
          bicep-version: 0.48.1
